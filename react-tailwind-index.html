<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>   
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #f3f4f6;
    }
    .near-full-width {
      width: calc(100% - 24px);
      max-width: calc(100% - 24px);
      margin-left: 12px;
      margin-right: 12px;
      border-radius: 0.375rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TimeBar = () => {
      const [currentTime, setCurrentTime] = useState(new Date());
      
      // Update time every second
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        
        return () => clearInterval(timer);
      }, []);
      
      // Define start and end times
      const startTime = new Date();
      startTime.setHours(7, 30, 0, 0);
      
      const endTime = new Date();
      endTime.setHours(15, 30, 0, 0);
      
      // Calculate total minutes in the range
      const totalMinutes = (endTime - startTime) / (1000 * 60);
      
      // Calculate the current position as a percentage
      const getCurrentPosition = () => {
        // Check if current time is before start time
        if (currentTime < startTime) {
          return 0;
        }
        
        // Check if current time is after end time
        if (currentTime > endTime) {
          return 100;
        }
        
        // Calculate percentage based on elapsed time
        const elapsedMinutes = (currentTime - startTime) / (1000 * 60);
        return (elapsedMinutes / totalMinutes) * 100;
      };
      
      // Generate time segments (30 min intervals with alternating colors and split into 25/5)
      const getTimeSegments = () => {
        const segments = [];
        const intervalMinutes = 30;
        const numBlocks = totalMinutes / intervalMinutes;
        
        for (let i = 0; i < numBlocks; i++) {
          const blockStartTime = new Date(startTime.getTime() + i * intervalMinutes * 60 * 1000);
          const periodNumber = `P${i + 1}`;
          
          // Calculate width percentages (25min is 5/6 of the 30min block, 5min is 1/6)
          const workWidth = (25 / 30) * (100 / numBlocks);
          const breakWidth = (5 / 30) * (100 / numBlocks);
          
          // Add work segment (25 min) with alternating colors
          segments.push({
            id: `${i}-work`,
            time: blockStartTime,
            width: workWidth,
            color: i % 2 === 0 ? 'bg-blue-200' : 'bg-blue-300',
            type: 'work',
            periodNumber: periodNumber
          });
          
          // Add break segment (5 min)
          segments.push({
            id: `${i}-break`,
            time: new Date(blockStartTime.getTime() + 25 * 60 * 1000),
            width: breakWidth,
            color: 'bg-gray-300',
            type: 'break',
            periodNumber: ''
          });
        }
        
        return segments;
      };
      
      // Format time as HH:MM AM/PM
      const formatTime = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      };

      // Format time with seconds for current time display
      const formatTimeWithSeconds = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      };
      
      const segments = getTimeSegments();
      const position = getCurrentPosition();
      
      return (
        <div className="w-full h-screen flex items-center">
          <div className="near-full-width bg-white shadow-md p-6 my-4">
            <div className="relative">
              {/* Time segments */}
              <div className="h-12 flex rounded-md overflow-hidden">
                {segments.map(segment => (
                  <div
                    key={segment.id}
                    className={`h-full ${segment.color} relative`}
                    style={{ width: `${segment.width}%` }}
                  >
                    <div className="absolute inset-0 flex items-center justify-center text-gray-700 font-medium text-sm">
                      {segment.periodNumber}
                    </div>
                  </div>
                ))}
              </div>
              
              {/* Current time marker */}
              <div 
                className="absolute top-0 h-12 w-1 bg-red-500 rounded-full shadow-lg"
                style={{ 
                  left: `${position}%`, 
                  transform: 'translateX(-50%)',
                  transition: 'left 0.5s ease-in-out',
                  zIndex: 10
                }}
              />
              
              {/* Time labels */}
              <div className="flex justify-between mt-2 text-sm text-gray-600">
                <span>{formatTime(startTime)}</span>
                <span>{formatTime(endTime)}</span>
              </div>

              {/* Current time display (centered and bold) */}
              <div className="text-center mt-4">
                <span className="font-bold text-lg">{formatTimeWithSeconds(currentTime)}</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render the app
    ReactDOM.render(<TimeBar />, document.getElementById('root'));
  </script>
</body>
</html>
