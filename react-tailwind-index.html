<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>   
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }
    .near-full-width {
      width: calc(100% - 24px);
      max-width: calc(100% - 24px);
      margin-left: 12px;
      margin-right: 12px;
      border-radius: 0.375rem;
    }
    .vertical-container {
      height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;  /* Chrome, Safari, Opera */
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TimeBar = () => {
      const [currentTime, setCurrentTime] = useState(new Date());
      const [isVertical, setIsVertical] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(false);
      
      // Apply dark/light mode to document body
      useEffect(() => {
        document.body.style.backgroundColor = isDarkMode ? '#1f2937' : '#f3f4f6';
      }, [isDarkMode]);
      
      // Update time every second
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        
        return () => clearInterval(timer);
      }, []);
      
      // Define start and end times
      const startTime = new Date();
      startTime.setHours(7, 30, 0, 0);
      
      const endTime = new Date();
      endTime.setHours(15, 30, 0, 0);
      
      // Calculate total minutes in the range
      const totalMinutes = (endTime - startTime) / (1000 * 60);
      
      // Calculate the current position as a percentage
      const getCurrentPosition = () => {
        // Check if current time is before start time
        if (currentTime < startTime) {
          return 0;
        }
        
        // Check if current time is after end time
        if (currentTime > endTime) {
          return 100;
        }
        
        // Calculate percentage based on elapsed time
        const elapsedMinutes = (currentTime - startTime) / (1000 * 60);
        return (elapsedMinutes / totalMinutes) * 100;
      };
      
      // Generate time segments (30 min intervals with alternating colors and split into 25/5)
      const getTimeSegments = () => {
        const segments = [];
        const intervalMinutes = 30;
        const numBlocks = totalMinutes / intervalMinutes;
        
        for (let i = 0; i < numBlocks; i++) {
          const blockStartTime = new Date(startTime.getTime() + i * intervalMinutes * 60 * 1000);
          // Format the time in short format for vertical mode
          const shortTimeLabel = blockStartTime.toLocaleTimeString([], { 
            hour: 'numeric', 
            minute: '2-digit',
            hour12: true 
          }).replace(' ', '').toLowerCase();
          
          const periodNumber = `P${i + 1}`;
          const timeLabel = formatTime(blockStartTime);
          
          // Check if this is lunch time (11am - 12 noon)
          const isLunchTime = blockStartTime.getHours() === 11;
          
          if (isLunchTime) {
            // Add lunch block (full 30 minutes)
            segments.push({
              id: `${i}-lunch`,
              time: blockStartTime,
              width: 100 / numBlocks,
              color: isDarkMode ? 'bg-amber-600' : 'bg-yellow-200',
              textColor: isDarkMode ? 'text-white' : 'text-gray-700',
              type: 'lunch',
              periodNumber: 'L', // Abbreviated
              timeLabel: timeLabel,
              shortTimeLabel: shortTimeLabel
            });
          } else {
            // Calculate width percentages (25min is 5/6 of the 30min block, 5min is 1/6)
            const workWidth = (25 / 30) * (100 / numBlocks);
            const breakWidth = (5 / 30) * (100 / numBlocks);
            
            // Add work segment (25 min) with alternating colors
            segments.push({
              id: `${i}-work`,
              time: blockStartTime,
              width: workWidth,
              color: isDarkMode 
                ? (i % 2 === 0 ? 'bg-blue-800' : 'bg-blue-700')
                : (i % 2 === 0 ? 'bg-blue-200' : 'bg-blue-300'),
              textColor: isDarkMode ? 'text-white' : 'text-gray-700',  
              type: 'work',
              periodNumber: periodNumber,
              timeLabel: timeLabel,
              shortTimeLabel: shortTimeLabel
            });
            
            // Add break segment (5 min)
            segments.push({
              id: `${i}-break`,
              time: new Date(blockStartTime.getTime() + 25 * 60 * 1000),
              width: breakWidth,
              color: isDarkMode ? 'bg-gray-700' : 'bg-gray-300',
              textColor: isDarkMode ? 'text-white' : 'text-gray-700',
              type: 'break',
              periodNumber: '',
              timeLabel: '',
              shortTimeLabel: ''
            });
          }
        }
        
        return segments;
      };
      
      // Format time as HH:MM AM/PM
      const formatTime = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      };
      
      // Format time with seconds for current time display
      const formatTimeWithSeconds = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      };
      
      const segments = getTimeSegments();
      const position = getCurrentPosition();
      
      // Render horizontal time bar
      const renderHorizontalBar = () => (
        <div className="relative">
          <div className="h-10 flex rounded-md overflow-hidden">
            {segments.map(segment => (
              <div
                key={segment.id}
                className={`h-full ${segment.color} relative`}
                style={{ width: `${segment.width}%` }}
              >
                <div className={`absolute inset-0 flex flex-col items-center justify-center ${segment.textColor} font-medium text-xs`}>
                  <div>{segment.periodNumber}</div>
                  {segment.timeLabel && (
                    <div className="text-xs mt-0.5">{segment.timeLabel}</div>
                  )}
                </div>
              </div>
            ))}
          </div>
          
          {/* Current time marker */}
          <div 
            className="absolute top-0 h-10 w-1 bg-red-500 rounded-full shadow-lg"
            style={{ 
              left: `${position}%`, 
              transform: 'translateX(-50%)',
              transition: 'left 0.5s ease-in-out',
              zIndex: 10
            }}
          />
        </div>
      );
      
      // Render vertical time bar
      const renderVerticalBar = () => (
        <div className="vertical-container">
          <div className="flex h-full">
            {/* Vertical bar */}
            <div className="relative w-full h-full">
              <div className="flex flex-col h-full rounded-md overflow-hidden">
                {segments.map(segment => {
                  // Calculate height as a percentage of total height based on time proportion
                  const heightPercentage = segment.width;
                  
                  return (
                    <div
                      key={segment.id}
                      className={`w-full ${segment.color} relative flex-shrink-0`}
                      style={{ height: `${heightPercentage}%` }}
                    >
                      <div className={`absolute inset-0 flex flex-col items-center justify-center ${segment.textColor} font-medium text-xs`}>
                        {segment.periodNumber}
                        {segment.shortTimeLabel && (
                          <div className="text-tiny mt-0.5">{segment.shortTimeLabel}</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
              
              {/* Current time marker */}
              <div 
                className="absolute left-0 w-full h-0.5 bg-red-500 rounded-full shadow-lg"
                style={{ 
                  top: `${position}%`, 
                  transform: 'translateY(-50%)',
                  transition: 'top 0.5s ease-in-out',
                  zIndex: 10
                }}
              />
            </div>
          </div>
        </div>
      );
      
      return (
        <div className={`${isVertical ? 'h-svh min-h-screen flex items-center justify-center' : 'w-full min-h-screen flex items-center justify-center'}`}>
          <div className={`${isVertical ? 'w-20' : 'near-full-width'} ${isDarkMode ? 'bg-gray-800 text-white' : 'bg-white text-gray-800'} shadow-md p-3 my-2 flex flex-col ${isVertical ? 'h-screen max-h-screen' : ''}`}>
            <div className="mb-3">
              {isVertical ? (
                /* Stack buttons vertically in vertical mode */
                <div className="flex flex-col space-y-1 mb-1">
                  <button 
                    onClick={() => setIsDarkMode(!isDarkMode)}
                    className={`px-2 py-0.5 ${isDarkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-200 hover:bg-gray-300'} rounded text-xs font-medium transition-colors`}
                  >
                    {isDarkMode ? "Light" : "Dark"}
                  </button>
                  <button 
                    onClick={() => setIsVertical(!isVertical)}
                    className={`px-2 py-0.5 ${isDarkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-200 hover:bg-gray-300'} rounded text-xs font-medium transition-colors`}
                  >
                    {isVertical ? "Horiz." : "Vert."}
                  </button>
                </div>
              ) : (
                /* Buttons side by side in horizontal mode */
                <div className="flex justify-between mb-1">
                  <button 
                    onClick={() => setIsDarkMode(!isDarkMode)}
                    className={`px-2 py-0.5 ${isDarkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-200 hover:bg-gray-300'} rounded text-xs font-medium transition-colors`}
                  >
                    {isDarkMode ? "Light" : "Dark"}
                  </button>
                  <button 
                    onClick={() => setIsVertical(!isVertical)}
                    className={`px-2 py-0.5 ${isDarkMode ? 'bg-gray-600 hover:bg-gray-500' : 'bg-gray-200 hover:bg-gray-300'} rounded text-xs font-medium transition-colors`}
                  >
                    {isVertical ? "Horiz." : "Vert."}
                  </button>
                </div>
              )}
              <div className="text-center font-bold text-sm">
                {formatTimeWithSeconds(currentTime)}
              </div>
            </div>
            
            {/* Render either horizontal or vertical bar based on state */}
            {isVertical ? renderVerticalBar() : renderHorizontalBar()}
          </div>
        </div>
      );
    };

    // Render the app
    ReactDOM.render(<TimeBar />, document.getElementById('root'));
  </script>
</body>
</html>
