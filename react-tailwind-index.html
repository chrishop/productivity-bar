<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Time Progress</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>   
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TimeBar = () => {
      const [currentTime, setCurrentTime] = useState(new Date());
      
      // Update time every second
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        
        return () => clearInterval(timer);
      }, []);
      
      // Define start and end times
      const startTime = new Date();
      startTime.setHours(7, 30, 0, 0);
      
      const endTime = new Date();
      endTime.setHours(15, 30, 0, 0);
      
      // Calculate total minutes in the range
      const totalMinutes = (endTime - startTime) / (1000 * 60);
      
      // Calculate the current position as a percentage
      const getCurrentPosition = () => {
        // Check if current time is before start time
        if (currentTime < startTime) {
          return 0;
        }
        
        // Check if current time is after end time
        if (currentTime > endTime) {
          return 100;
        }
        
        // Calculate percentage based on elapsed time
        const elapsedMinutes = (currentTime - startTime) / (1000 * 60);
        return (elapsedMinutes / totalMinutes) * 100;
      };
      
      // Generate time segments (30 min intervals with alternating colors and split into 25/5)
      const getTimeSegments = () => {
        const segments = [];
        const intervalMinutes = 30;
        const numBlocks = totalMinutes / intervalMinutes;
        const totalSegments = numBlocks * 2; // Each block now has 2 segments (25min + 5min)
        
        for (let i = 0; i < numBlocks; i++) {
          const blockStartTime = new Date(startTime.getTime() + i * intervalMinutes * 60 * 1000);
          const periodNumber = `P${i + 1}`;
          
          // Calculate width percentages (25min is 5/6 of the 30min block, 5min is 1/6)
          const workWidth = (25 / 30) * (100 / numBlocks);
          const breakWidth = (5 / 30) * (100 / numBlocks);
          
          // Add work segment (25 min) with alternating colors
          segments.push({
            id: `${i}-work`,
            time: blockStartTime,
            width: workWidth,
            color: i % 2 === 0 ? 'bg-blue-200' : 'bg-blue-300',
            type: 'work',
            periodNumber: periodNumber
          });
          
          // Add break segment (5 min)
          segments.push({
            id: `${i}-break`,
            time: new Date(blockStartTime.getTime() + 25 * 60 * 1000),
            width: breakWidth,
            color: 'bg-gray-300',
            type: 'break',
            periodNumber: ''
          });
        }
        
        return segments;
      };
      
      // Format time as HH:MM AM/PM
      const formatTime = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      };
      
      const segments = getTimeSegments();
      const position = getCurrentPosition();
      
      return (
        <div className="flex flex-col h-screen bg-gray-100">
          <h1 className="text-3xl font-bold py-4 px-6 text-center text-gray-800">Daily Time Progress</h1>
          
          <div className="w-full flex-grow flex flex-col">
            <div className="relative w-full px-0">
              {/* Time segments */}
              <div className="h-16 flex w-full">
                {segments.map(segment => (
                  <div
                    key={segment.id}
                    className={`h-full ${segment.color} relative`}
                    style={{ width: `${segment.width}%` }}
                  >
                    <div className="absolute inset-0 flex items-center justify-center text-gray-700 font-medium">
                      {segment.periodNumber}
                    </div>
                  </div>
                ))}
              </div>
              
              {/* Current time marker */}
              <div 
                className="absolute top-0 h-16 w-1 bg-red-500 rounded-full shadow-lg"
                style={{ 
                  left: `${position}%`, 
                  transform: 'translateX(-50%)',
                  transition: 'left 0.5s ease-in-out',
                  zIndex: 10
                }}
              />
              
              {/* Time labels */}
              <div className="flex justify-between mt-2 text-sm text-gray-600 px-2">
                <span>{formatTime(startTime)}</span>
                <span>{formatTime(endTime)}</span>
              </div>
            </div>
            
            <div className="mt-6 text-center text-gray-700 pb-6">
              <p className="text-xl">Current Time: <span className="font-semibold">{formatTime(currentTime)}</span></p>
              <p className="mt-2 text-sm">The bar shows your day from 7:30 AM to 3:30 PM</p>
              <div className="mt-3 flex items-center justify-center text-sm">
                <div className="flex items-center mr-4">
                  <div className="w-4 h-4 bg-blue-200 mr-2"></div>
                  <span>25 min work (light)</span>
                </div>
                <div className="flex items-center mr-4">
                  <div className="w-4 h-4 bg-blue-300 mr-2"></div>
                  <span>25 min work (dark)</span>
                </div>
                <div className="flex items-center">
                  <div className="w-4 h-4 bg-gray-300 mr-2"></div>
                  <span>5 min break</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Render the app
    ReactDOM.render(<TimeBar />, document.getElementById('root'));
  </script>
</body>
</html>
