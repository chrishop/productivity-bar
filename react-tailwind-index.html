<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>   
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #f3f4f6;
    }
    .near-full-width {
      width: calc(100% - 24px);
      max-width: calc(100% - 24px);
      margin-left: 12px;
      margin-right: 12px;
      border-radius: 0.375rem;
    }
    .vertical-container {
      height: 70vh;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TimeBar = () => {
      const [currentTime, setCurrentTime] = useState(new Date());
      const [isVertical, setIsVertical] = useState(false);
      
      // Update time every second
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        
        return () => clearInterval(timer);
      }, []);
      
      // Define start and end times
      const startTime = new Date();
      startTime.setHours(7, 30, 0, 0);
      
      const endTime = new Date();
      endTime.setHours(15, 30, 0, 0);
      
      // Calculate total minutes in the range
      const totalMinutes = (endTime - startTime) / (1000 * 60);
      
      // Calculate the current position as a percentage
      const getCurrentPosition = () => {
        // Check if current time is before start time
        if (currentTime < startTime) {
          return 0;
        }
        
        // Check if current time is after end time
        if (currentTime > endTime) {
          return 100;
        }
        
        // Calculate percentage based on elapsed time
        const elapsedMinutes = (currentTime - startTime) / (1000 * 60);
        return (elapsedMinutes / totalMinutes) * 100;
      };
      
      // Generate time segments (30 min intervals with alternating colors and split into 25/5)
      const getTimeSegments = () => {
        const segments = [];
        const intervalMinutes = 30;
        const numBlocks = totalMinutes / intervalMinutes;
        
        for (let i = 0; i < numBlocks; i++) {
          const blockStartTime = new Date(startTime.getTime() + i * intervalMinutes * 60 * 1000);
          const periodNumber = `P${i + 1}`;
          const timeLabel = formatTime(blockStartTime);
          
          // Check if this is lunch time (11am - 12 noon)
          const isLunchTime = blockStartTime.getHours() === 11;
          
          if (isLunchTime) {
            // Add lunch block (full 30 minutes)
            segments.push({
              id: `${i}-lunch`,
              time: blockStartTime,
              width: 100 / numBlocks,
              color: 'bg-yellow-200',
              type: 'lunch',
              periodNumber: 'LUNCH',
              timeLabel: timeLabel
            });
          } else {
            // Calculate width percentages (25min is 5/6 of the 30min block, 5min is 1/6)
            const workWidth = (25 / 30) * (100 / numBlocks);
            const breakWidth = (5 / 30) * (100 / numBlocks);
            
            // Add work segment (25 min) with alternating colors
            segments.push({
              id: `${i}-work`,
              time: blockStartTime,
              width: workWidth,
              color: i % 2 === 0 ? 'bg-blue-200' : 'bg-blue-300',
              type: 'work',
              periodNumber: periodNumber,
              timeLabel: timeLabel
            });
            
            // Add break segment (5 min)
            segments.push({
              id: `${i}-break`,
              time: new Date(blockStartTime.getTime() + 25 * 60 * 1000),
              width: breakWidth,
              color: 'bg-gray-300',
              type: 'break',
              periodNumber: '',
              timeLabel: ''
            });
          }
        }
        
        return segments;
      };
      
      // Format time as HH:MM AM/PM
      const formatTime = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      };
      
      // Format time with seconds for current time display
      const formatTimeWithSeconds = (date) => {
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      };
      
      const segments = getTimeSegments();
      const position = getCurrentPosition();
      
      // Render horizontal time bar
      const renderHorizontalBar = () => (
        <div className="relative">
          <div className="h-10 flex rounded-md overflow-hidden">
            {segments.map(segment => (
              <div
                key={segment.id}
                className={`h-full ${segment.color} relative`}
                style={{ width: `${segment.width}%` }}
              >
                <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-700 font-medium text-xs">
                  <div>{segment.periodNumber}</div>
                  {segment.timeLabel && (
                    <div className="text-xs mt-0.5">{segment.timeLabel}</div>
                  )}
                </div>
              </div>
            ))}
          </div>
          
          {/* Current time marker */}
          <div 
            className="absolute top-0 h-10 w-1 bg-red-500 rounded-full shadow-lg"
            style={{ 
              left: `${position}%`, 
              transform: 'translateX(-50%)',
              transition: 'left 0.5s ease-in-out',
              zIndex: 10
            }}
          />
          
          {/* Start and end time labels */}
          <div className="flex justify-between mt-1 text-xs text-gray-600">
            <span>{formatTime(startTime)}</span>
            <span>{formatTime(endTime)}</span>
          </div>
        </div>
      );
      
      // Render vertical time bar
      const renderVerticalBar = () => (
        <div className="vertical-container">
          <div className="flex">
            {/* Time labels */}
            <div className="flex flex-col justify-between pr-1 text-xs text-gray-600">
              {segments.filter(segment => segment.timeLabel).map(segment => (
                <div key={`label-${segment.id}`} className="h-10 flex items-center">
                  {segment.timeLabel}
                </div>
              ))}
            </div>
            
            {/* Vertical bar */}
            <div className="relative w-20">
              <div className="flex flex-col rounded-md overflow-hidden">
                {segments.map(segment => (
                  <div
                    key={segment.id}
                    className={`w-full ${segment.color} relative`}
                    style={{ height: segment.type === 'break' ? '8px' : '40px' }}
                  >
                    <div className="absolute inset-0 flex items-center justify-center text-gray-700 font-medium text-xs">
                      {segment.periodNumber}
                    </div>
                  </div>
                ))}
              </div>
              
              {/* Current time marker */}
              <div 
                className="absolute left-0 w-full h-1 bg-red-500 rounded-full shadow-lg"
                style={{ 
                  top: `${position}%`, 
                  transform: 'translateY(-50%)',
                  transition: 'top 0.5s ease-in-out',
                  zIndex: 10
                }}
              />
            </div>
          </div>
        </div>
      );
      
      return (
        <div className="w-full min-h-screen flex items-center justify-center">
          <div className="near-full-width bg-white shadow-md p-4 my-2">
            {/* Mode toggle button */}
            <div className="flex justify-end mb-2">
              <button 
                onClick={() => setIsVertical(!isVertical)}
                className="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm font-medium transition-colors"
              >
                {isVertical ? "Horizontal" : "Vertical"}
              </button>
            </div>
            
            {/* Render either horizontal or vertical bar based on state */}
            {isVertical ? renderVerticalBar() : renderHorizontalBar()}
            
            {/* Current time display (centered and bold) */}
            <div className="text-center mt-3">
              <span className="font-bold text-base">{formatTimeWithSeconds(currentTime)}</span>
            </div>
          </div>
        </div>
      );
    };

    // Render the app
    ReactDOM.render(<TimeBar />, document.getElementById('root'));
  </script>
</body>
